# Supabase project configuration.
#
# There was none before this. That mattered most for Edge Functions: without a
# declaration every function defaults to verifying a JWT, which is right for the
# ones the app calls and fatally wrong for the ones a platform calls -- TikTok
# and Higgsfield do not carry a Supabase session, so their callbacks would have
# been rejected with a 401 that looks like the provider being broken.
#
# Each public function below states in one line why it is public and what stands
# in for the JWT it does not have.

project_id = "dosszkllkassvyprkhrg"

[api]
enabled = true
port = 54321
schemas = ["public"]
# `private` is deliberately absent. It holds encrypted platform tokens and
# provider keys and must never be reachable over PostgREST at all.
extra_search_path = ["public", "extensions"]
# A 30-day plan is 30 posts across up to 3 accounts. 1000 keeps a full plan in
# one round trip without letting anyone page the whole table.
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
# Transaction mode. The worker's four loops each hold a small pool and poll on a
# timer; session mode would pin a backend per connection and exhaust the pooler.
# The cost is that LISTEN/NOTIFY does not survive it, which is why the loops poll
# rather than subscribe.
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 200

[realtime]
enabled = true

[storage]
enabled = true
# TikTok accepts up to 1GB, but the free tier caps uploads at 50MB, so that is
# the real ceiling until the project is on a paid plan. Short-form video at
# 1080x1920 lands well under it; this becomes a problem only for long or
# high-bitrate renders, and it will need raising before launch.
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "autocast://auth"
additional_redirect_urls = ["autocast://auth", "autocast://oauth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
# Lets the app open straight into itself on first launch instead of a sign-in
# wall. The row in auth.users is real, so RLS, brands and connections all work
# normally -- and Supabase can upgrade the same row to a permanent identity
# later without the person losing anything they made.
enable_anonymous_sign_ins = true

[auth.email]
enable_signup = true
enable_confirmations = true


# ----------------------------------------------------------------- functions
#
# Called by the app, with a user session. JWT verification stays on.

[functions.agent-chat]
verify_jwt = true

# Starts a provider connection. Returns only a URL to open -- never a client id,
# a verifier, a code or a token.
[functions.connector-start]
verify_jwt = true

# Re-asks a connection what it can do. Same session as the app.
[functions.connector-refresh]
verify_jwt = true

# Prices one image or video for the Generate card. The provider's dry run --
# nothing is submitted, nothing is spent.
[functions.quote]
verify_jwt = true

# The whole catalogue, for the browser behind the Generate card.
[functions.models]
verify_jwt = true

[functions.propose-plan]
verify_jwt = true

[functions.connect-generator]
verify_jwt = true

[functions.generate-media]
verify_jwt = true

[functions.oauth-start]
verify_jwt = true

[functions.creator-info]
verify_jwt = true

[functions.prepare-post]
verify_jwt = true

[functions.approve-post]
verify_jwt = true

[functions.publish-post]
verify_jwt = true

[functions.fetch-metrics]
verify_jwt = true

# Called by somebody else's server, or by the database itself. No Supabase
# session exists, so each one carries its own proof instead.

# The platform redirects a browser here after the person approves access. The
# PKCE `state` we issued is what proves the callback belongs to a flow we started.
[functions.oauth-callback]
verify_jwt = false

# The same shape for AI providers rather than platforms. A provider redirecting
# a browser back carries no Supabase session, so the `state` minted in
# connector-start stands in for one: stashed server-side against the pending
# connection, consumed exactly once, and a callback carrying a state nobody
# stashed touches nothing. This is also the reason the redirect lands here at
# all rather than in the app -- the code is exchanged and the tokens are sealed
# on this side, so no credential ever reaches the client.
[functions.connector-callback]
verify_jwt = false

# The long-job executor. Same cron pattern and the same shared secret: it
# carries one step of one agent run per tick, so closing the app changes
# nothing and a step that dies costs one step rather than the whole job.
[functions.run-agent-jobs]
verify_jwt = false

# Woken every minute by pg_cron through pg_net, which carries no JWT. What
# stands in for one is a shared secret in `x-cron-secret`, compared in constant
# time and kept in `private.scheduler_config` rather than in the cron command --
# job definitions are readable by anyone who can see cron.job.
[functions.run-due-posts]
verify_jwt = false

# The other half of the same loop, on its own cron job so a minute spent
# downloading a 40MB video is not a minute in which nothing gets published.
[functions.poll-generations]
verify_jwt = false

# The generation provider signs nothing, so the URL itself carries an
# unguessable per-job token -- and even then the body is treated as a wake-up,
# never as truth: the worker re-reads status_url with our own key before
# believing anything.
[functions.hf-webhook]
verify_jwt = false

# TikTok signs its webhooks; the function verifies that signature before acting.
[functions.tiktok-webhook]
verify_jwt = false

# App Store Server Notifications V2 arrive as a signed JWS whose certificate
# chain is verified back to Apple's root.
[functions.apple-notifications-v2]
verify_jwt = false
