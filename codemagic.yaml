# Codemagic pipeline -- the fallback for when GitHub Actions is unavailable.
#
# The README says "No Codemagic". That was true when GitHub Actions was free
# for this account; it is not any more, and a pipeline you cannot run is worth
# less than a stylistic preference. The GitHub workflows are kept in place and
# unchanged, so switching back is nothing more than choosing which one to
# trigger.
#
# Free tier: 500 macOS M2 build minutes a month on a PERSONAL account (team
# accounts get none). At the 4-8 minutes these builds take, that is roughly
# 60-100 builds. Minutes reset monthly and do not roll over.
#
# One-time setup, all in a browser, no Mac:
#   1. codemagic.io -> sign in with GitHub -> add skdksdcw68-dev/content-app
#   2. Teams/Integrations -> App Store Connect -> add the API key. Needs the
#      key id, the ISSUER ID, and the .p8. Name it exactly "Autocast ASC Key"
#      so the `integrations:` block below resolves.
#   3. Start a build. Nothing else is configured in the UI -- this file is the
#      configuration.

definitions:
  # xcodegen is not preinstalled on the Codemagic image, and the .xcodeproj is
  # deliberately not committed, so every workflow regenerates it first.
  generate_project: &generate_project
    name: Generate the Xcode project
    script: |
      set -euo pipefail
      which xcodegen >/dev/null 2>&1 || brew install xcodegen
      xcodegen generate

workflows:

  # ---------------------------------------------------------------- tests
  # Mirrors .github/workflows/ios-tests.yml. No Apple credentials of any kind,
  # so it runs before signing exists -- which makes it the fast loop for "does
  # this compile", the thing that cannot be checked on Windows.
  ios-tests:
    name: iOS Tests
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
    cache:
      # Supabase is compiled from source otherwise, which dominates the build.
      cache_paths:
        - $CM_BUILD_DIR/SourcePackages
        - $HOME/Library/Caches/Homebrew
    scripts:
      - *generate_project
      - name: Run unit tests
        script: |
          set -euo pipefail
          # Simulator names change with every Xcode release, so pick the newest
          # available iPhone at runtime rather than pinning a name that rots.
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in sorted(runtimes.items()):
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device['name'].startswith('iPhone'):
                      best = device['name']
          print(best)
          ")
          echo "Testing on: $DEVICE"
          # Per-test timeouts, so one blocking test fails in a minute with its
          # name attached instead of hanging the job to the 30 minute cap.
          xcodebuild test \
            -project ContentApp.xcodeproj \
            -scheme ContentApp \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -clonedSourcePackagesDirPath SourcePackages \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 180 \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult

  # ----------------------------------------------------------- testflight
  # Mirrors .github/workflows/ios-testflight.yml. Manual only, on purpose -- a
  # TestFlight upload should not fire on every push.
  #
  # Signing is the SAME material as the GitHub lane, delivered the same way:
  # the certificate and profile minted by scripts/bootstrap-signing.ts, held
  # here as secure variables in the `autocast_signing` group.
  #
  # An earlier version used Codemagic's `ios_signing` integration, which fetches
  # or CREATES signing files itself. That is neater right up until it decides it
  # needs a new certificate -- and every distribution slot on this account is
  # full, so it would have failed, or worse, revoked something to make room.
  #
  # This lane also calls `fastlane beta`, the identical lane GitHub Actions
  # runs, rather than reimplementing the build in YAML. The Info.plist guards
  # and the ITMS-90129 name check live in the Fastfile and are shared, so the
  # two pipelines cannot drift apart.
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      groups:
        - autocast_signing
    scripts:
      - *generate_project
      - name: Install the signing certificate and profile
        script: |
          set -euo pipefail
          CERT="$CM_BUILD_DIR/identity.p12"
          PROFILE="$CM_BUILD_DIR/profile.mobileprovision"

          echo -n "$BUILD_CERTIFICATE_BASE64"    | base64 --decode > "$CERT"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"

          # Codemagic's own keychain tooling rather than raw `security`. The
          # runner's default login keychain has no password we know, so
          # codesign would raise a dialog and hang forever on a headless
          # machine -- the failure that cost email-app a debugging session.
          keychain initialize
          keychain add-certificates --certificate "$CERT" --certificate-password "$P12_PASSWORD"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/"

          echo "Signing identities available:"
          security find-identity -v -p codesigning
      - name: Set up Ruby and fastlane
        script: |
          set -euo pipefail
          # Pinned in the Gemfile, so a run cannot pick up whatever fastlane
          # shipped that day and break signing on a commit that touched nothing.
          bundle install
      - name: Build and upload to TestFlight
        script: bundle exec fastlane beta
    artifacts:
      - build/ios/ipa/*.ipa
      - "*.ipa"
      - /tmp/xcodebuild_logs/*.log
      - ~/Library/Logs/gym/*.log
