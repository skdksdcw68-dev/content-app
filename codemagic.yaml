# Codemagic pipeline -- the fallback for when GitHub Actions is unavailable.
#
# The README says "No Codemagic". That was true when GitHub Actions was free
# for this account; it is not any more, and a pipeline you cannot run is worth
# less than a stylistic preference. The GitHub workflows are kept in place and
# unchanged, so switching back is nothing more than choosing which one to
# trigger.
#
# Free tier: 500 macOS M2 build minutes a month on a PERSONAL account (team
# accounts get none). At the 4-8 minutes these builds take, that is roughly
# 60-100 builds. Minutes reset monthly and do not roll over.
#
# One-time setup, all in a browser, no Mac:
#   1. codemagic.io -> sign in with GitHub -> add skdksdcw68-dev/content-app
#   2. Teams/Integrations -> App Store Connect -> add the API key. Needs the
#      key id, the ISSUER ID, and the .p8. Name it exactly "Autocast ASC Key"
#      so the `integrations:` block below resolves.
#   3. Start a build. Nothing else is configured in the UI -- this file is the
#      configuration.

definitions:
  # xcodegen is not preinstalled on the Codemagic image, and the .xcodeproj is
  # deliberately not committed, so every workflow regenerates it first.
  generate_project: &generate_project
    name: Generate the Xcode project
    script: |
      set -euo pipefail
      which xcodegen >/dev/null 2>&1 || brew install xcodegen
      xcodegen generate

workflows:

  # ---------------------------------------------------------------- tests
  # Mirrors .github/workflows/ios-tests.yml. No Apple credentials of any kind,
  # so it runs before signing exists -- which makes it the fast loop for "does
  # this compile", the thing that cannot be checked on Windows.
  ios-tests:
    name: iOS Tests
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
    cache:
      # Supabase is compiled from source otherwise, which dominates the build.
      cache_paths:
        - $CM_BUILD_DIR/SourcePackages
        - $HOME/Library/Caches/Homebrew
    scripts:
      - *generate_project
      - name: Run unit tests
        script: |
          set -euo pipefail
          # Simulator names change with every Xcode release, so pick the newest
          # available iPhone at runtime rather than pinning a name that rots.
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in sorted(runtimes.items()):
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device['name'].startswith('iPhone'):
                      best = device['name']
          print(best)
          ")
          echo "Testing on: $DEVICE"
          # Per-test timeouts, so one blocking test fails in a minute with its
          # name attached instead of hanging the job to the 30 minute cap.
          xcodebuild test \
            -project ContentApp.xcodeproj \
            -scheme ContentApp \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -clonedSourcePackagesDirPath SourcePackages \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 180 \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult

  # ----------------------------------------------------------- testflight
  # Mirrors .github/workflows/ios-testflight.yml. Manual only, on purpose -- a
  # TestFlight upload should not fire on every push.
  #
  # Signing is the SAME material as the GitHub lane, delivered the same way:
  # the certificate and profile minted by scripts/bootstrap-signing.ts, held
  # here as secure variables in the `autocast_signing` group.
  #
  # An earlier version used Codemagic's `ios_signing` integration, which fetches
  # or CREATES signing files itself. That is neater right up until it decides it
  # needs a new certificate -- and every distribution slot on this account is
  # full, so it would have failed, or worse, revoked something to make room.
  #
  # This lane also calls `fastlane beta`, the identical lane GitHub Actions
  # runs, rather than reimplementing the build in YAML. The Info.plist guards
  # and the ITMS-90129 name check live in the Fastfile and are shared, so the
  # two pipelines cannot drift apart.
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      groups:
        - autocast_signing
    scripts:
      - *generate_project
      - name: Install the signing certificate and profile
        script: |
          set -euo pipefail
          CERT="$CM_BUILD_DIR/identity.p12"
          PROFILE="$CM_BUILD_DIR/profile.mobileprovision"

          echo -n "$BUILD_CERTIFICATE_BASE64"    | base64 --decode > "$CERT"
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"

          # Codemagic's own keychain tooling rather than raw `security`. The
          # runner's default login keychain has no password we know, so
          # codesign would raise a dialog and hang forever on a headless
          # machine -- the failure that cost email-app a debugging session.
          keychain initialize
          keychain add-certificates --certificate "$CERT" --certificate-password "$P12_PASSWORD"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/"

          echo "Signing identities available:"
          security find-identity -v -p codesigning
      - name: Work out the build number
        script: |
          set -euo pipefail
          # Asked of App Store Connect rather than taken from Codemagic's own
          # counter, which restarts at 1 on a new account -- builds went up
          # numbered 3, 4 and 5 while 29 already existed. fastlane's
          # latest_testflight_build_number was tried twice and returned nothing
          # both times, so this queries the API directly.
          NEXT="$(node scripts/next-build-number.mjs)"
          echo "BUILD_NUMBER=$NEXT" >> "$CM_ENV"
          echo "Building as $NEXT"
      - name: Set up Ruby and fastlane
        script: |
          set -euo pipefail
          # Pinned in the Gemfile, so a run cannot pick up whatever fastlane
          # shipped that day and break signing on a commit that touched nothing.
          bundle install
      - name: Build and upload to TestFlight
        script: bundle exec fastlane beta
    artifacts:
      - build/ios/ipa/*.ipa
      - "*.ipa"
      - /tmp/xcodebuild_logs/*.log
      - ~/Library/Logs/gym/*.log

  # ------------------------------------------------------------ simulator
  # The real iOS Simulator, watched from Windows. There is no simulator for
  # Windows -- it ships inside Xcode -- so this borrows the build Mac's: it
  # builds the app, boots an iPhone, launches Autocast in it, and then holds the
  # machine open so the desktop can be watched and clicked over VNC.
  #
  # Manual only, and started from the Codemagic UI, not the API: the remote
  # screen exists only if "Enable SSH/VNC access" is ticked in the Start new
  # build dialog, and the REST API has no parameter for it. The build page then
  # shows a host, port, user and password for a VNC viewer.
  #
  # Every minute the Mac is held open is a build minute out of the 500, so the
  # hold has its own, shorter limit (KEEP_MINUTES). Ending early is a file on
  # the remote desktop: `touch ~/Desktop/STOP`, or cancel the build.
  ios-simulator:
    name: iOS Simulator (remote screen)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        KEEP_MINUTES: 30
    cache:
      cache_paths:
        - $CM_BUILD_DIR/SourcePackages
        - $HOME/Library/Caches/Homebrew
    scripts:
      - *generate_project
      - name: Build, boot an iPhone, launch the app
        script: |
          set -euo pipefail
          # One script does build + install + launch, and a copy is left on the
          # desktop, so new code is a `git pull` and a double-click inside the
          # same session instead of a whole new build.
          cat > "$HOME/Desktop/rebuild.command" <<'EOF'
          #!/bin/bash
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          # Newest available iPhone, by UDID -- names change with every Xcode.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          best = None
          for runtime, devices in sorted(json.load(sys.stdin)['devices'].items()):
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device['name'].startswith('iPhone'):
                      best = device['udid']
          print(best)
          ")
          build() {
            xcodebuild build \
              -project ContentApp.xcodeproj \
              -scheme ContentApp \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath build/sim \
              -clonedSourcePackagesDirPath SourcePackages \
              "$@"
          }
          # Signed ad hoc, the way Xcode signs a simulator build on a desk: an
          # unsigned one carries no entitlements, and the keychain (where the
          # Supabase session lives) can refuse it. Unsigned is the fallback
          # because it is what the test lane already proves compiles.
          build CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO || build CODE_SIGNING_ALLOWED=NO
          APP=$(find build/sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          xcrun simctl bootstatus "$UDID" -b
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" Autocast
          # The same build, zipped: Appetize.io takes exactly this file and
          # plays it in a browser, with no Mac held open.
          ditto -c -k --keepParent "$APP" build/sim/Autocast-simulator.zip
          EOF
          sed -i '' "s|\$CM_BUILD_DIR|$CM_BUILD_DIR|" "$HOME/Desktop/rebuild.command"
          chmod +x "$HOME/Desktop/rebuild.command"
          "$HOME/Desktop/rebuild.command"
      - name: Hold the Mac open for the remote screen
        script: |
          set -euo pipefail
          echo "Connect with a VNC viewer now. Holding for $KEEP_MINUTES minutes."
          echo "To finish early: touch ~/Desktop/STOP on the Mac, or cancel the build."
          END=$(( $(date +%s) + KEEP_MINUTES * 60 ))
          while [ "$(date +%s)" -lt "$END" ] && [ ! -f "$HOME/Desktop/STOP" ]; do
            sleep 5
          done
    artifacts:
      - build/sim/Autocast-simulator.zip

  # ------------------------------------------------------- review screenshot
  # App Store Connect will not send a subscription for review without a
  # screenshot of where it is bought. This builds the simulator app, opens the
  # paywall on its own (`-paywallPreview`, Debug only, see ContentAppApp) and
  # photographs it. The PNG is the artefact; scripts upload it to every product.
  ios-paywall-shot:
    name: iOS Paywall screenshot
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    cache:
      cache_paths:
        - $CM_BUILD_DIR/SourcePackages
    scripts:
      - *generate_project
      - name: Build, launch on the paywall, photograph it
        script: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          best = None
          for runtime, devices in sorted(json.load(sys.stdin)['devices'].items()):
              if 'iOS' not in runtime:
                  continue
              for device in devices:
                  if device['name'] in ('iPhone 16 Pro Max', 'iPhone 17 Pro Max', 'iPhone 16 Plus', 'iPhone 17 Pro'):
                      best = device['udid']
              if best is None:
                  for device in devices:
                      if device['name'].startswith('iPhone'):
                          best = device['udid']
          print(best)
          ")
          xcodebuild build \
            -project ContentApp.xcodeproj \
            -scheme ContentApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/sim \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO | tail -5
          APP=$(find build/sim/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3 || true
          xcrun simctl install "$UDID" "$APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          mkdir -p build/shots
          # One launch per screen: the paywall (the review screenshot), the
          # welcome after a purchase, and the editor opened the way chat
          # opens it.
          for SHOT in paywall welcome editor; do
            xcrun simctl terminate "$UDID" "$BUNDLE" || true
            xcrun simctl launch "$UDID" "$BUNDLE" "-${SHOT}Preview"
            # The welcome is caught mid-confetti; the others once settled.
            if [ "$SHOT" = welcome ]; then sleep 2.5; else sleep 20; fi
            xcrun simctl io "$UDID" screenshot "build/shots/$SHOT.png"
            if [ "$SHOT" = welcome ]; then
              # And once the confetti has fallen, to see the screen itself.
              sleep 4
              xcrun simctl io "$UDID" screenshot "build/shots/welcome-settled.png"
            fi
          done
          # The first-launch intro, caught at four moments of its nine seconds:
          # the chat, the video being made, the Dynamic Island, the close.
          # And the whole intro as a video, for Netro to watch (19 Oct 2026):
          # the simulator's own screen recording, started before the launch.
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force build/shots/intro.mp4 &
          RECORDER=$!
          sleep 2
          xcrun simctl launch "$UDID" "$BUNDLE" -introPreview
          sleep 11
          kill -INT $RECORDER || true
          wait $RECORDER || true
          ls -la build/shots/intro.mp4 || true
          xcrun simctl terminate "$UDID" "$BUNDLE" || true
          xcrun simctl launch "$UDID" "$BUNDLE" -introPreview
          sleep 2.4; xcrun simctl io "$UDID" screenshot build/shots/intro-1-chat.png
          sleep 2.2; xcrun simctl io "$UDID" screenshot build/shots/intro-2-making.png
          sleep 2.2; xcrun simctl io "$UDID" screenshot build/shots/intro-3-island.png
          sleep 3.2; xcrun simctl io "$UDID" screenshot build/shots/intro-4-end.png
          for SHOT in profile subscriber; do
            xcrun simctl terminate "$UDID" "$BUNDLE" || true
            xcrun simctl launch "$UDID" "$BUNDLE" "-${SHOT}Preview"
            sleep 15
            xcrun simctl io "$UDID" screenshot "build/shots/$SHOT.png"
          done
          ls -la build/shots
    artifacts:
      - build/shots/*.png
      - build/shots/*.mp4
